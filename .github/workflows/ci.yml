name: Verify LASTCRATE
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build

  genlayer-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile contracts/RescueMatcher.py contracts/HandoffLedger.py
      - run: python -m pip install --no-cache-dir "genvm-linter==0.11.0" "genlayer-test==0.29.2" "pytest>=8,<9"
      - name: GenVM static AST lint
        run: |
          genvm-lint lint contracts/RescueMatcher.py
          genvm-lint lint contracts/HandoffLedger.py
      - name: GenLayer SDK direct-mode tests (mocked LLM, no RPC)
        run: pytest -q tests/contracts/
